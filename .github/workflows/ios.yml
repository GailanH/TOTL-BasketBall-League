name: iOS Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Publish the generated project on the `generated-xcodeproj` branch so a Mac without
      # XcodeGen (or a Claude session) can fetch it with plain git. Only on pushes to main.
      - name: Publish generated Xcode project
        if: github.event_name != 'pull_request'
        run: |
          SRC=$(git rev-parse --short HEAD)
          TMP=$(mktemp -d)
          cp -R Project_Comp_B.xcodeproj "$TMP/"
          cd "$TMP"
          git init -q -b generated-xcodeproj
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Generated Project_Comp_B.xcodeproj from $SRC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" generated-xcodeproj

      # Use the runner's default (newest stable) Xcode and whatever iPhone simulator it ships
      # with, instead of hard-coding versions that disappear as GitHub updates its images.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -version
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,ds in sorted(d.items(), reverse=True) if 'iOS' in r for x in ds if x['name'].startswith('iPhone')))")
          echo "Simulator: $SIM_ID"
          xcodebuild test \
            -project Project_Comp_B.xcodeproj \
            -scheme Project_Comp_B \
            -destination "id=$SIM_ID" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

      # Publish UI-test screenshots to the `ui-screenshots` branch (even when tests fail, which
      # is when they're most useful), so they can be reviewed with plain git.
      - name: Publish UI test screenshots
        if: always() && github.event_name != 'pull_request'
        run: |
          [ -d TestResults.xcresult ] || { echo "No test results"; exit 0; }
          SRC=$(git rev-parse --short HEAD)
          OUT=$(mktemp -d)
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path "$OUT/raw" || { echo "Attachment export failed"; exit 0; }
          mkdir -p "$OUT/repo/screenshots"
          # Rename exported files to their attachment names using the manifest.
          python3 - "$OUT/raw" "$OUT/repo/screenshots" <<'PY'
          import json, os, shutil, sys
          raw, dest = sys.argv[1], sys.argv[2]
          manifest = json.load(open(os.path.join(raw, "manifest.json")))
          for test in manifest:
              for a in test.get("attachments", []):
                  name = a.get("suggestedHumanReadableName") or a["exportedFileName"]
                  base = name.split("_0_")[0] if "_0_" in name else os.path.splitext(name)[0]
                  ext = os.path.splitext(a["exportedFileName"])[1] or ".png"
                  shutil.copy(os.path.join(raw, a["exportedFileName"]), os.path.join(dest, base + ext))
          PY
          grep -E "Test Case .* (passed|failed)|XCTAssert|error:" build.log | sort -u > "$OUT/repo/RESULTS.txt" || true
          cd "$OUT/repo"
          git init -q -b ui-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "UI test screenshots from $SRC"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ui-screenshots

      # Surface compiler errors and test failures as annotations, readable without the full log.
      - name: Report errors
        if: failure()
        run: |
          touch build.log
          # One annotation holding up to 60 lines (GitHub caps annotations per step).
          MSG=$(grep -E "error:|Test Case .* failed|XCTAssert" build.log | sort -u | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')
          [ -n "$MSG" ] && echo "::error::${MSG}"
          tail -40 build.log
