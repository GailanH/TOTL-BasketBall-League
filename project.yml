# XcodeGen spec — generates Project_Comp_B.xcodeproj from this file.
#
# This repo was originally uploaded as loose .swift files with no Xcode
# project wrapper, so it can't be opened in Xcode or built by CI as-is.
# Rather than hand-write a project.pbxproj (very easy to corrupt and
# impossible to verify outside Xcode), this uses XcodeGen to generate one
# from a plain-text spec that's easy to read, diff, and regenerate.
#
# One-time setup on your Mac:
#   1. brew install xcodegen
#   2. cd into this repo folder
#   3. xcodegen generate
#   4. Open Project_Comp_B.xcodeproj in Xcode, set your Team under
#      Signing & Capabilities, and run.
#
# The generated .xcodeproj is gitignored on purpose (see .gitignore) — it's
# regenerated from this file, both locally and in CI, so there's nothing to
# merge-conflict on. Whenever files are added/removed/renamed, just re-run
# `xcodegen generate` instead of manually editing the Xcode project.

name: Project_Comp_B

options:
  bundleIdPrefix: com.totl
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

targets:
  Project_Comp_B:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "README.md"
          - "ROADMAP.md"
          - "*.md"
          - ".gitignore"
          - ".git"
          - ".github"
          - ".claude"
          - ".DS_Store"
          - "*.xcodeproj"
          - "Info.plist"
          - "Tests"
          - "UITests"
          - "build"
          - "DerivedData"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.totl.ProjectCompB
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"

  Project_Comp_BTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
    dependencies:
      - target: Project_Comp_B

  Project_Comp_BUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: 5.0
        TEST_TARGET_NAME: Project_Comp_B
    dependencies:
      - target: Project_Comp_B

schemes:
  Project_Comp_B:
    build:
      targets:
        Project_Comp_B: all
        Project_Comp_BTests: [test]
        Project_Comp_BUITests: [test]
    test:
      targets:
        - Project_Comp_BTests
        - Project_Comp_BUITests
